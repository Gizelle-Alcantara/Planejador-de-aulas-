<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acesso | Agenda SENAI</title>
<style>
:root{--surface:#fff;--line:#d9e0ea;--bad:#b3261e;--muted:#526579;--ok:#1b7f4b}*{box-sizing:border-box}body{margin:0;background:#f2f5f9;color:#14202e;font:16px/1.6 system-ui,sans-serif}main{width:min(100% - 32px,540px);margin:64px auto;background:white;border:1px solid var(--line);border-radius:16px;padding:32px}h1{font-size:1.8rem;line-height:1.2;letter-spacing:-.03em}label{display:flex;flex-direction:column;gap:6px;margin:18px 0;font-size:.9rem;font-weight:600}input,button{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;min-height:44px}button{background:#0b5cab;color:white;font-weight:600;cursor:pointer;margin-top:8px}button:disabled{opacity:.6;cursor:wait}a{color:#0b5cab}p{color:var(--muted)}.brand{font-weight:700;color:#0b5cab;font-size:.85rem;letter-spacing:.08em}.field-error,.error{color:var(--bad)}.field-error{font-size:.8rem}.success{color:var(--ok)}.required-marker::after{content:' *';color:var(--bad)}.form-hint{font-size:.8rem}#feedback{min-height:1.6em;overflow-wrap:anywhere}:focus-visible{outline:3px solid #0b5cab;outline-offset:3px}[hidden]{display:none!important}@media(max-width:600px){main{margin:24px auto;padding:24px}}
</style><script src="/recovery.js" defer></script><script src="/forms.js" defer></script></head><body><main><span class="brand">AGENDA SENAI</span><h1 id="title">Recuperar acesso</h1><p id="description">Informe seu usuário e o e-mail de recuperação cadastrado pela coordenação.</p>
<form id="request-form"><label>Usuário<input name="login" type="text" autocomplete="username" maxlength="40" required></label><label>E-mail de recuperação<input name="email" type="email" autocomplete="email" maxlength="254" required></label><button type="submit" disabled>Enviar link de recuperação</button></form>
<form id="reset-form" hidden><label>Nova senha<input name="password" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required></label><label>Confirmar nova senha<input name="confirmation" type="password" autocomplete="new-password" minlength="8" maxlength="1024" required></label><button type="submit">Salvar nova senha</button></form>
<p id="feedback" role="status" aria-live="polite">Verificando disponibilidade…</p><p><a id="login-link" href="/#login">Voltar para o acesso</a></p><p><a href="/recuperar.html" id="new-link" hidden>Solicitar outro link</a></p><p id="help">Sem e-mail cadastrado? Procure a coordenação. A senha mestre é gerenciada na configuração do servidor.</p></main></body></html>
