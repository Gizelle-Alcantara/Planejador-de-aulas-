<script>
const SEED=__SEED__;
const LOGO="__LOGO__";
(function(){
  const K="planejador-turma-v1-theme",L={light:"Claro",dark:"Escuro",auto:"Automático"},NEXT={light:"dark",dark:"auto",auto:"light"};
  let m="light";try{m=localStorage.getItem(K)||"light"}catch(e){}
  if(!L[m])m="light";
  const apply=()=>{const r=document.documentElement;if(m==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",m);
    const b=document.getElementById("themeBtn");if(b){b.textContent="Tema: "+L[m];b.setAttribute("aria-label","Alternar tema. Atual: "+L[m])}};
  apply();
  const lg=document.getElementById("logo");if(lg)lg.src=LOGO;
  const b=document.getElementById("themeBtn");
  if(b)b.addEventListener("click",()=>{m=NEXT[m];try{localStorage.setItem(K,m)}catch(e){}apply()});
})();
const KEY="planejador-turma-v1";
const WD=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const WDL=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const TURNOS=["Matutino","Matutino NEM","Vespertino","Vespertino NEM","Noturno (Técnico)","Noturno (Comunidade)","Diurno"];
const TABS=[["painel","Painel"],["calendario","Calendário"],["cronograma","Cronograma"],["enviar","Enviar"],["compartilhar","Compartilhar"],["disciplinas","Disciplinas"],["docentes","Docentes"],["turma","Turma"],["dados","Dados"]];

/* ---------- estado ---------- */
function seedTurma(){
  const days={};
  for(const [iso,e] of Object.entries(SEED.days)){
    const s=e.s||[];const d={s};
    if(e.h){d.h=e.h;d.t=s.length?"nota":"feriado"}
    days[iso]=d;
  }
  return {
    cfg:{turma:"202629",curso:"Técnico em Desenvolvimento de Sistemas",turno:"Noturno (Técnico)",modulo:"I",
      coord:"Silas Pereira",email:"",local:"",inicio:"2026-08-11",termino:"2026-12-17",aulasDia:4},
    ucs:SEED.ucs.map(u=>({...u})),days,envios:[]
  };
}
const BASE0="https://claude.ai/artifact/CfTYuZKeRR1fAn42uNdZtZ";
const KEY2="planejador-multi-v2";
const clone=o=>JSON.parse(JSON.stringify(o));
const canon=o=>JSON.stringify(o,(k,v)=>v&&typeof v==="object"&&!Array.isArray(v)?Object.fromEntries(Object.entries(v).sort(([a],[b])=>a<b?-1:1)):v);
const slug=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"turma";
const H0=location.hash;
let MODE=H0.startsWith("#aluno")?"aluno":H0.startsWith("#docente")?"docente":"planner";
const ALUNO_ID=MODE==="aluno"?H0.slice(7):"",DOC_ID=MODE==="docente"?H0.slice(9):"";
let G={docentes:[],base:BASE0},T={},CUR="",S=null;
const emptyTurma=()=>{const s=seedTurma();s.ucs=[];s.days={};return s};
const seedAll=()=>({G:{docentes:[],base:BASE0},T:{"202629":seedTurma()},CUR:"202629"});
const stripT=st=>{const r={...st};delete r.docentes;return r};
const strippedT=()=>Object.fromEntries(Object.entries(T).map(([k,v])=>[k,stripT(v)]));
function legacyToMulti(o){const id=slug(o.cfg.turma),st=stripT(o);return {G:{docentes:o.docentes||[],base:(o.cfg.linkAluno||BASE0).split("#")[0]},T:{[id]:st},CUR:id}}
if(MODE==="planner"){
  try{const r=localStorage.getItem(KEY2);
    if(r){const o=JSON.parse(r);G=o.G;T=o.T;CUR=o.CUR}
    else{const r1=localStorage.getItem(KEY);if(r1){const m=legacyToMulti(JSON.parse(r1));G=m.G;T=m.T;CUR=m.CUR}}}catch(e){}
}
if(!T||!Object.keys(T).length){if(MODE!=="planner"){T={x:emptyTurma()};CUR="x"}else{const m=seedAll();G=m.G;T=m.T;CUR=m.CUR}}
function normalize(){
  G.docentes=Array.isArray(G.docentes)?G.docentes:[];G.base=G.base||BASE0;
  G.docentes.forEach(d=>{if(!Array.isArray(d.semana))d.semana=[];if(!Array.isArray(d.bloqueios))d.bloqueios=[]});
  const have=new Set(G.docentes.map(d=>d.nome));
  Object.values(T).forEach(st=>{
    st.envios=Array.isArray(st.envios)?st.envios:[];
    if(st.cfg.destinatarios===undefined)st.cfg.destinatarios="";
    st.ucs.forEach(u=>{if(u.docente&&!have.has(u.docente)){G.docentes.push({nome:u.docente,email:"",semana:[],bloqueios:[]});have.add(u.docente)}});
    st.docentes=G.docentes;
  });
  if(CUR&&!T[CUR])CUR=MODE==="planner"?Object.keys(T)[0]:"";
  S=CUR?T[CUR]:null;
}
normalize();
/* ---------- salvamento: banco do artefato (db) + cópia local ---------- */
let dref=null,saveTimer=null,saving=Promise.resolve(),dirty=false,lastJson={};
const STAT={local:"Salvo só neste navegador",saving:"Salvando…",saved:"Todos os lançamentos salvos",error:"Erro ao salvar. Tentaremos de novo na próxima alteração.",ro:"Somente leitura: você não tem permissão para salvar"};
function setStatus(k){UI.status=k;const el=document.getElementById("stat");if(el){el.textContent=STAT[k]||"";el.dataset.k=k}}
const docItems=()=>[["geral",{docentes:G.docentes,base:G.base}],...Object.entries(T).map(([id,st])=>["turma-"+id,{state:stripT(st)}])];
function persistLocal(){try{localStorage.setItem(KEY2,JSON.stringify({G,T:strippedT(),CUR}))}catch(e){}}
function save(){
  if(MODE!=="planner")return;
  persistLocal();
  if(!dref){setStatus("local");return}
  dirty=true;setStatus("saving");clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{saving=saving.then(async()=>{
    try{
      const items=docItems();
      for(const [doc,data] of items){const js=canon(data);if(lastJson[doc]===js)continue;await dref.doc(doc).set({...JSON.parse(js),savedAt:new Date().toISOString()});lastJson[doc]=js}
      for(const doc of Object.keys(lastJson)){if(!items.some(x=>x[0]===doc)){try{await dref.doc(doc).delete()}catch(e){}delete lastJson[doc]}}
      if(!docItems().some(([doc,data])=>lastJson[doc]!==canon(data))){dirty=false;setStatus("saved")}
    }catch(e){dirty=false;setStatus(e&&e.code==="invalid_argument"?"ro":"error")}
  })},500);
}
function fromDocs(docs){
  const g=docs.geral?{docentes:clone(docs.geral.docentes||[]),base:docs.geral.base}:{docentes:[],base:BASE0},t={};
  for(const [k,v] of Object.entries(docs))if(k.startsWith("turma-")&&v&&v.state)t[k.slice(6)]=clone(v.state);
  if(!docs.geral)Object.values(t).forEach(st=>(st.docentes||[]).forEach(d=>{if(!g.docentes.some(x=>x.nome===d.nome))g.docentes.push(d)}));
  Object.values(t).forEach(st=>{delete st.docentes});
  return {g,t,legacy:!docs.geral};
}
const UI={fUc:"",env:{periodo:"sem2",canal:"zap",msg:null},boot:true,loaded:false,empty:false,savedAt:"",live:false,err:"",cw:null,status:"local",tab:"painel",month:null,tool:"edit",holName:"",ucFilter:"",confirm:null};
try{const t=localStorage.getItem(KEY+"-tab");if(t&&TABS.some(x=>x[0]===t))UI.tab=t}catch(e){}

/* ---------- datas ---------- */
const pd=iso=>{const [y,m,d]=iso.split(".").length>1?[0,0,0]:iso.split("-").map(Number);return new Date(Date.UTC(y,m-1,d))};
const fd=dt=>dt.toISOString().slice(0,10);
const addD=(iso,n)=>{const d=pd(iso);d.setUTCDate(d.getUTCDate()+n);return fd(d)};
const dow=iso=>pd(iso).getUTCDay();
const br=iso=>iso&&iso!=="-"?iso.split("-").reverse().join("/"):"-";
const todayISO=()=>{const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toMin=h=>{const [a,b]=h.split(":").map(Number);return a*60+b};
const hm=m=>String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");

/* ---------- regras da planilha ---------- */
const horaOf=c=>c.turno==="Matutino NEM"?50:60;
const horaAula=()=>horaOf(S.cfg);
function horariosOf(c){
  const h=horaOf(c);
  const st={"Matutino":"07:30","Matutino NEM":"07:00","Vespertino NEM":"13:20","Vespertino":"13:00","Diurno":"07:30","Noturno (Comunidade)":"18:00"}[c.turno]||"18:40";
  let t=toMin(st);const rows=[];
  if(c.turno==="Diurno"){const d=h*2;[["1 - 2",t],["3 - 4",t+d],["5 - 6",toMin("13:00")]].forEach(([n,s])=>rows.push({n,i:s,f:s+d}))}
  else{const n=c.turno==="Matutino NEM"?6:4;for(let i=1;i<=n;i++){if(c.turno==="Matutino NEM"&&i===4)t+=20;rows.push({n:String(i),i:t,f:t+h});t+=h}}
  return rows;
}
const horarios=()=>horariosOf(S.cfg);
const spanOf=c=>{const h=horariosOf(c);return [h[0].i,h[h.length-1].f]};
const colorOf=sig=>{const i=S.ucs.findIndex(u=>u.sigla===sig);return `var(--u${(i<0?7:i)%8})`};
const ucOf=sig=>S.ucs.find(u=>u.sigla===sig);
const calc=()=>calcOf(S);
function calcOf(S){
  const c=S.cfg,hora=horaOf(c),isos=Object.keys(S.days).sort();
  const dates={},enc={};
  S.ucs.forEach(u=>dates[u.sigla]=[]);
  for(const iso of isos){
    const d=S.days[iso];enc[iso]=[];
    (d.s||[]).forEach(sg=>{(dates[sg]=dates[sg]||[]).push(iso);enc[iso].push(dates[sg].length)});
  }
  const t=todayISO();
  const rows=S.ucs.map((u,i)=>{
    const Q=Math.ceil(hora===60?u.ch:u.ch*1.2),P=Math.ceil(Q/c.aulasDia),R=Math.floor(Q*.25);
    const ds=dates[u.sigla]||[],ini=ds[0]||"-",fim=ds[ds.length-1]||"-";
    const status=ds.length&&t>=ini&&t<=fim?"EM ANDAMENTO":ds.length&&t>fim?"CONCLUÍDA":"PLANEJADA";
    return {u,i,Q,P,R,aloc:ds.length,faltam:P-ds.length,ini,fim,status,ds};
  });
  return {rows,enc,dates,isos};
}
const PLUR=["domingos","segundas-feiras","terças-feiras","quartas-feiras","quintas-feiras","sextas-feiras","sábados"];
function blockMsg(iso,sg){
  const u=ucOf(sg);if(!u||!u.docente)return "";
  const d=S.docentes.find(x=>x.nome===u.docente);if(!d)return "";
  const w=dow(iso);
  if((d.semana||[]).includes(w))return `${d.nome} não leciona ${w===0||w===6?"aos":"às"} ${PLUR[w]}`;
  const b=(d.bloqueios||[]).find(x=>x.de&&iso>=x.de&&iso<=(x.ate||x.de));
  if(b)return `${d.nome} está indisponível${b.motivo?" ("+b.motivo+")":""} de ${br(b.de)}${b.ate&&b.ate!==b.de?" a "+br(b.ate):""}`;
  const sp1=spanOf(S.cfg);
  for(const st of Object.values(T)){
    if(st===S)continue;const dd=st.days[iso];if(!dd||!(dd.s||[]).length)continue;
    const sp2=spanOf(st.cfg);if(!(sp1[0]<sp2[1]&&sp2[0]<sp1[1]))continue;
    const hit=dd.s.map(x=>st.ucs.find(u2=>u2.sigla===x)).find(u2=>u2&&u2.docente===u.docente);
    if(hit)return `${d.nome} já leciona ${hit.sigla} na turma ${st.cfg.turma} nesse horário`;
  }
  return "";
}
function confDay(iso){
  const s=(S.days[iso]||{}).s||[];const m=[];
  if(s.length>1)m.push(`mais de uma disciplina no mesmo dia (${s.join(" e ")})`);
  s.forEach(sg=>{const b=blockMsg(iso,sg);if(b)m.push(b)});
  return m;
}
const countConf=()=>Object.keys(S.days).reduce((a,i)=>a+confDay(i).length,0);
function avisos(C){
  const a=[];
  C.rows.forEach(r=>{
    if(r.faltam>0)a.push(["warn",`${r.u.sigla}: faltam ${r.faltam} encontro(s) para lançar (${r.aloc} de ${r.P}).`]);
    if(r.faltam<0)a.push(["err",`${r.u.sigla}: ${-r.faltam} encontro(s) a mais que o previsto (${r.aloc} de ${r.P}).`]);
    if(!r.u.docente)a.push(["info",`${r.u.sigla}: sem docente definido.`]);
  });
  for(const iso of C.isos){
    const d=S.days[iso],s=d.s||[];if(!s.length)continue;
    const w=dow(iso);
    if(w===0||w===6)a.push(["warn",`Aula em ${WDL[w]}, ${br(iso)} (${s.join(", ")}).`]);
    if(iso<S.cfg.inicio||iso>S.cfg.termino)a.push(["warn",`Aula fora do período da turma: ${br(iso)} (${s.join(", ")}).`]);
    if(d.t==="feriado"||d.t==="sem")a.push(["err",`Aula marcada em dia sem aula: ${br(iso)}.`]);
    s.forEach(sg=>{if(!ucOf(sg))a.push(["err",`Sigla "${sg}" em ${br(iso)} não existe nas disciplinas.`])});
    confDay(iso).forEach(m=>a.push(["err",`Choque em ${br(iso)}: ${m}.`]));
  }
  return a;
}

function monthList(a,b){
  const out=[];let [y,m]=(a||S.cfg.inicio).split("-").map(Number);const [ye,me]=(b||S.cfg.termino).split("-").map(Number);
  while((y<ye||(y===ye&&m<=me))&&out.length<48){out.push(`${y}-${String(m).padStart(2,"0")}`);m++;if(m>12){m=1;y++}}
  return out;
}
function shiftMonth(ym,n){let [y,m]=ym.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${String(m).padStart(2,"0")}`}

  else if(tool==="feriado"||tool==="sem"){S.days[iso]={s:[],t:tool,h:UI.holName||(tool==="sem"?"SEM AULA":"FERIADO")}}
  else if(tool.startsWith("uc:")){
    const sg=tool.slice(3);
    if(e.t==="feriado"||e.t==="sem"){toast("Dia marcado como "+(e.t==="sem"?"sem aula":"feriado")+". Limpe o dia antes.");return}
    const k=e.s.lastIndexOf(sg);
    if(k>=0){e.s.splice(k,1)}
    else if(e.s.length){toast(`Choque: o dia já tem ${e.s[0]}. Remova antes de lançar outra disciplina.`);return}
    else{const m=blockMsg(iso,sg);if(m){toast("Choque: "+m+".");return}e.s.push(sg)}
    if(!e.s.length&&!e.h)delete S.days[iso];else S.days[iso]=e;
  }
  save();renderView();

function saveTurma(){
  const v=id=>document.getElementById(id).value.trim(),err=m=>{document.getElementById("ntErr").textContent=m};
  const cod=v("ntCod"),id=slug(cod);
  if(!cod)return err("Informe o código da turma.");
  if(T[id])return err("Já existe uma turma com esse código.");
  if(!v("ntIni")||!v("ntFim"))return err("Informe as datas de início e término.");
  if(v("ntFim")<v("ntIni"))return err("O término precisa ser depois do início.");
  const src=T[v("ntCopy")];
  const st={cfg:{turma:cod,curso:v("ntCurso"),turno:v("ntTurno"),modulo:v("ntMod"),coord:v("ntCoord"),email:"",local:"",inicio:v("ntIni"),termino:v("ntFim"),aulasDia:Math.max(1,+v("ntAulas")||4),destinatarios:""},
    ucs:src?clone(src.ucs):[],days:{},envios:[]};
  if(src)for(const [k,d] of Object.entries(src.days))if(d.t==="feriado"||d.t==="sem")st.days[k]={s:[],t:d.t,h:d.h};
  T[id]=st;CUR=id;normalize();UI.month=null;UI.ucFilter="";UI.tab=src?"calendario":"disciplinas";
  save();closeModal();renderView();toast(`Turma ${cod} criada`);
}
const closeModal=()=>document.getElementById("modalRoot").innerHTML="";
function autoAlloc(){
  const sg=document.getElementById("aUc").value,from=document.getElementById("aFrom").value;
  let qty=+document.getElementById("aQty").value;
  const wds=[...document.querySelectorAll(".aw:checked")].map(x=>+x.value);
  if(!sg||!from||!qty||!wds.length){toast("Informe disciplina, data, quantidade e dias da semana.");return}
  let iso=from,n=0,last="",guard=0,pul=0;
  while(n<qty&&guard++<800){
    const e=S.days[iso]||{s:[]};
    if(wds.includes(dow(iso))&&e.t!=="feriado"&&e.t!=="sem"&&!(e.s||[]).length){
      if(blockMsg(iso,sg))pul++;
      else{e.s=[sg];S.days[iso]=e;n++;last=iso}
    }
    iso=addD(iso,1);
  }
  save();toast(`${n} encontro(s) lançado(s)${last?" até "+br(last):""}${pul?` · ${pul} dia(s) pulado(s) por bloqueio do docente`:""}${n<qty?" · período esgotado antes de completar":""}.`);renderView();
}

let DL=null;
const sigHash=()=>{const s=JSON.stringify({d:S.days,u:S.ucs.map(u=>[u.sigla,u.nome,u.ch,u.docente,u.sala]),c:[S.cfg.inicio,S.cfg.termino,S.cfg.turno,S.cfg.aulasDia]});let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)};
const alunoLink=(id=CUR)=>G.base+"#aluno-"+id;
const PER={sem2:"Próximas 2 semanas",mes:"Mês atual",tudo:"Período completo"};
function envRange(p){
  const t=todayISO(),c=S.cfg;
  if(p==="sem2")return [t,addD(t,13)];
  if(p==="mes"){const [y,m]=t.split("-").map(Number);return [`${t.slice(0,7)}-01`,fd(new Date(Date.UTC(y,m,0)))]}
  return [c.inicio,c.termino];
}
function buildMsg(p,canal){
  const c=S.cfg,C=calc(),[a,b]=envRange(p),zap=canal==="zap",B=x=>zap?`*${x}*`:x;
  const P=Object.fromEntries(C.rows.map(r=>[r.u.sigla,r.P]));
  const L=[];
  Object.keys(S.days).sort().filter(i=>i>=a&&i<=b).forEach(iso=>{
    const d=S.days[iso],s=d.s||[],lab=`${WD[dow(iso)]} ${iso.slice(8)}/${iso.slice(5,7)}`;
    if(s.length)L.push(`• ${lab}: `+s.map((sg,j)=>{const u=ucOf(sg)||{};return `${sg} ${C.enc[iso][j]}/${P[sg]??"?"}${u.docente?" ("+u.docente+")":""}`}).join(" + ")+(d.h?` – ${d.h}`:""));
    else if(d.h)L.push(`• ${lab}: ${d.t==="sem"?"Sem aula":"Feriado"} – ${d.h}`);
  });
  const lim=C.rows.filter(r=>r.P>0).map(r=>`${r.u.sigla} ${r.R}`).join(" · ");
  return [B(`Calendário de aulas – Turma ${c.turma}`),`${c.curso} · Módulo ${c.modulo}`,`Horário: ${rowHorario()} · ${PER[p].toLowerCase()} (${br(a)} a ${br(b)})`,"",
    ...(L.length?L:["Nenhuma aula lançada neste período."]),"",`Limite de faltas (25% das aulas): ${lim}`,
    "",`Calendário sempre atualizado: ${alunoLink()}`,
    ...(c.coord?["",`Coordenação: ${c.coord}`]:[])].join("\n");
}

function csvText(){

  for(const iso of C.isos)(S.days[iso].s||[]).forEach((sg,j)=>{const u=ucOf(sg)||{};L.push([br(iso),WD[dow(iso)],sg,u.nome||"",`${C.enc[iso][j]}/${P[sg]??"?"}`,u.docente||"",u.sala||"",S.days[iso].h||""].join(";"))});
  return L.join("\n");

function icsText(){
  const C=calc(),h=horarios(),a=hm(h[0].i).replace(":","")+"00",b=hm(h[h.length-1].f).replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planejador de Turma//PT-BR"];
  for(const iso of C.isos){const s=[...new Set(S.days[iso].s||[])];if(!s.length)continue;const d=iso.replace(/-/g,"");
    L.push("BEGIN:VEVENT",`UID:${d}-${S.cfg.turma}@planejador`,`DTSTAMP:${d}T000000`,`DTSTART:${d}T${a}`,`DTEND:${d}T${b}`,`SUMMARY:${s.join(" + ")} - Turma ${S.cfg.turma}`,"END:VEVENT")}
  L.push("END:VCALENDAR");return L.join("\r\n");
}

function roCells(ym,C){

  ${A.turmas.flatMap(x=>x.rows.map(r=>`<tr><td class="mono">${esc(x.st.cfg.turma)}</td><td><span class="sig" style="--c:var(--u${x.ti%8})">${esc(r.u.sigla)}</span> ${esc(r.u.nome)}</td><td class="n mono">${r.u.ch} h</td><td class="n mono">${r.ds.filter(z=>z<=t).length}/${r.P}</td><td class="mono">${br(r.ini)}</td><td class="mono">${br(r.fim)}</td><td class="mono">${spanStr(x.st.cfg)}</td><td><span class="pill ${r.status.replace(" ","-")}">${r.status}</span></td></tr>`)).join("")}
  </tbody></table></div></section>
  <section class="panel"><h2>Disponibilidade</h2>${wk.length||bl.length?`<ul class="av">${wk.length?`<li><span class="dot info"></span><span>Não leciona ${esc(wk.join(", "))}.</span></li>`:""}${bl.map(x=>`<li><span class="dot info"></span><span>Indisponível de ${br(x.de)}${x.ate&&x.ate!==x.de?" a "+br(x.ate):""}${x.motivo?" ("+esc(x.motivo)+")":""}.</span></li>`).join("")}</ul>`:'<p class="muted" style="margin:0">Nenhum bloqueio cadastrado.</p>'}
    <p class="small muted" style="margin-bottom:0">Para mudar sua disponibilidade, fale com a coordenação.</p></section>
  <details class="panel"><summary>Levar minhas aulas para a agenda</summary>
    <div class="row" style="margin-top:12px">${DL?'<button class="btn" data-act="dldoc">Baixar minhas aulas (CSV)</button>':""}<button class="btn" data-act="copy" data-id="docIcs">Copiar agenda (.ics)</button></div>
    <p class="small muted">Cole o texto em um arquivo com extensão .ics e importe no Google Agenda ou no Outlook.</p>
    <textarea id="docIcs" readonly>${esc(docIcs(A))}</textarea></details>`;
}
function docIcs(A){
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planejador de Turma//PT-BR"];
  A.aulas.forEach(a=>{const st=T[Object.keys(T)[a.ti]],sp=spanOf(st.cfg),d=a.iso.replace(/-/g,"");
    L.push("BEGIN:VEVENT",`UID:${d}-${a.turma}-${a.sig}@planejador`,`DTSTAMP:${d}T000000`,`DTSTART:${d}T${hm(sp[0]).replace(":","")}00`,`DTEND:${d}T${hm(sp[1]).replace(":","")}00`,`SUMMARY:${a.sig} - Turma ${a.turma}`,"END:VEVENT")});
  L.push("END:VCALENDAR");return L.join("\r\n");
}
function csvDoc(A){return ["Data;Dia;Turma;Sigla;Disciplina;Encontro;Sala;Horário;Observação",...A.aulas.map(a=>[br(a.iso),WD[dow(a.iso)],a.turma,a.sig,a.nome,`${a.n}/${a.P}`,a.sala,a.hor,a.h].join(";"))].join("\n")}

/* ---------- render / eventos ---------- */
function renderView(){
  if(UI.boot){document.getElementById("hdr").innerHTML="<h1>Planejador de Turma</h1>";document.getElementById("tabs").innerHTML="";document.getElementById("view").innerHTML='<p class="muted">Carregando…</p>';return}
  if(MODE==="aluno"){renderAluno();return}
  if(MODE==="docente"){renderDocente();return}
  if(MODE==="landing"){renderLanding();return}
  renderHead();
  const v=document.getElementById("view");
  v.innerHTML={painel:vPainel,calendario:vCal,cronograma:vCron,enviar:vEnviar,compartilhar:vShare,disciplinas:vDisc,docentes:vDoc,turma:vTurma,dados:vDados}[UI.tab]();
  afterRender();
}
const view=document.getElementById("view");
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  const a=b.dataset.act;
  if(a==="mclose"){if(e.target===b)closeModal();return}
  if(a==="tab"){UI.tab=b.dataset.k;UI.confirm=null;try{localStorage.setItem(KEY+"-tab",UI.tab)}catch(x){}renderView();window.scrollTo(0,0)}
  else if(a==="day")dayClick(b.dataset.iso);
  else if(a==="tool"){UI.tool=b.dataset.k;renderView()}
  else if(a==="mprev"){UI.month=shiftMonth(UI.month,-1);renderView()}
  else if(a==="mnext"){UI.month=shiftMonth(UI.month,1);renderView()}
  else if(a==="msave")saveModal();
  else if(a==="mclear"){delete S.days[document.querySelector(".modal").dataset.iso];save();closeModal();renderView()}
  else if(a==="mclose2")closeModal();
  else if(a==="auto")autoAlloc();
  else if(a==="ucadd"){S.ucs.push({nome:"Nova disciplina",sigla:"NOVA"+(S.ucs.length+1),ch:40,docente:"",sala:""});save();renderView()}
  else if(a==="ucdel"){const i=+b.dataset.i;if(UI.confirm==="uc"+i){const sg=S.ucs[i].sigla;S.ucs.splice(i,1);for(const [k,d] of Object.entries(S.days)){d.s=(d.s||[]).filter(x=>x!==sg);if(!d.s.length&&!d.h)delete S.days[k]}UI.confirm=null;save()}else UI.confirm="uc"+i;renderView()}
  else if(a==="docadd"){let n=S.docentes.length+1,nm;do{nm="Novo docente "+n++}while(S.docentes.some(d=>d.nome===nm));S.docentes.push({nome:nm,email:"",semana:[],bloqueios:[]});save();renderView()}
  else if(a==="docdel"){const i=+b.dataset.i;if(UI.confirm==="doc"+i){const nm=S.docentes[i].nome;S.docentes.splice(i,1);Object.values(T).forEach(st=>st.ucs.forEach(u=>{if(u.docente===nm)u.docente=""}));UI.confirm=null;save()}else UI.confirm="doc"+i;renderView()}
  else if(a==="envopt"){UI.env[b.dataset.k]=b.dataset.v;UI.env.msg=null;renderView()}
  else if(a==="envlog"){S.envios.push({em:new Date().toISOString(),canal:UI.env.canal,periodo:UI.env.periodo,sig:sigHash()});save();toast("Envio registrado");renderView()}
  else if(a==="dlcsv"||a==="dlhtml"){
    const csv=a==="dlcsv";
    DL.save({filename:csv?`encontros-turma-${S.cfg.turma}.csv`:`calendario-turma-${S.cfg.turma}.html`,data:csv?"\ufeff"+csvText():htmlCalendario()})
      .then(()=>toast("Arquivo salvo"),er=>{if(!er||er.code!=="declined")toast("Não foi possível salvar o arquivo.")});
  }
  else if(a==="bdadd"){const d=S.docentes[+b.dataset.i];d.bloqueios.push({de:todayISO(),ate:todayISO(),motivo:""});save();renderView()}
  else if(a==="bddel"){S.docentes[+b.dataset.i].bloqueios.splice(+b.dataset.j,1);save();renderView()}
  else if(a==="fuc"){UI.fUc=b.dataset.k;renderView()}
  else if(a==="turmanew")openTurmaModal();
  else if(a==="turmasave")saveTurma();
  else if(a==="turmago"){CUR=b.dataset.id;normalize();UI.month=null;UI.ucFilter="";persistLocal();renderView();window.scrollTo(0,0)}
  else if(a==="turmadel"){if(UI.confirm==="turmadel"){delete T[CUR];CUR=Object.keys(T)[0];normalize();UI.confirm=null;UI.month=null;UI.tab="painel";save();toast("Turma excluída")}else UI.confirm="turmadel";renderView()}
  else if(a==="copyv")copyValue(b.dataset.v);
  else if(a==="dldoc"){const d=G.docentes.find(x=>slug(x.nome)===DOC_ID);if(d&&DL)DL.save({filename:`aulas-${DOC_ID}.csv`,data:"\ufeff"+csvDoc(docAgg(d))}).then(()=>toast("Arquivo salvo"),er=>{if(!er||er.code!=="declined")toast("Não foi possível salvar o arquivo.")})}
  else if(a==="copy")copyText(b.dataset.id);
  else if(a==="import"){try{const o=JSON.parse(document.getElementById("tImp").value);if(o.turmas&&o.geral){G=o.geral;T=o.turmas;CUR=Object.keys(T)[0]}else if(o.cfg&&o.ucs&&o.days){const m=legacyToMulti(o);G=m.G;T=m.T;CUR=m.CUR}else throw 0;normalize();save();toast("Dados restaurados");renderView()}catch(x){toast("JSON inválido. Cole a cópia completa.")}}
  else if(a==="reset"){if(UI.confirm==="reset"){{const m=seedAll();G=m.G;T=m.T;CUR=m.CUR}normalize();UI.confirm=null;UI.month=null;save();toast("Planilha original restaurada")}else UI.confirm="reset";renderView()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="turmaSel"){CUR=t.value;normalize();UI.month=null;UI.ucFilter="";persistLocal();renderView()}
  else if(t.id==="mjump"){UI.month=t.value;renderView()}
  else if(t.id==="cf"){UI.ucFilter=t.value;renderView()}
  else if(t.id==="aUc"){const r=calc().rows.find(r=>r.u.sigla===t.value);document.getElementById("aQty").value=Math.max(r?r.faltam:1,1)}
  else if(t.id==="mS1"||t.id==="mS2"||t.id==="mT")updModalInfo();
  else if(t.id==="fImp"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{document.getElementById("tImp").value=fr.result};fr.readAsText(t.files[0])}
  else if(t.dataset.cfg){const k=t.dataset.cfg;S.cfg[k]=k==="aulasDia"?Math.max(1,+t.value||1):t.value;if(k==="inicio")UI.month=null;save();renderView()}
  else if(t.dataset.bw!==undefined){
    const d=S.docentes[+t.dataset.bw],w=+t.dataset.wd;d.semana=d.semana.filter(x=>x!==w);if(t.checked)d.semana.push(w);d.semana.sort();
    save();renderView();const n=countConf();if(n)toast(`${n} aula(s) já lançadas entram em choque. Veja os avisos no Painel.`)}
  else if(t.dataset.bd!==undefined){
    const b=S.docentes[+t.dataset.bd].bloqueios[+t.dataset.j];b[t.dataset.f]=t.value;if(b.de&&b.ate&&b.ate<b.de)b.ate=b.de;
    save();renderView();const n=countConf();if(n)toast(`${n} aula(s) já lançadas entram em choque. Veja os avisos no Painel.`)}
  else if(t.dataset.gbase){G.base=t.value.trim().split("#")[0]||BASE0;save();renderView()}
  else if(t.dataset.cfgx){S.cfg[t.dataset.cfgx]=t.value.trim();UI.env.msg=null;save();if(t.id==="envDest")renderView()}
  else if(t.dataset.doc!==undefined){
    const d=S.docentes[+t.dataset.doc],f=t.dataset.f,v=t.value.trim();
    if(f==="nome"){if(!v||S.docentes.some(x=>x!==d&&x.nome===v)){toast("Nome vazio ou já cadastrado.");renderView();return}
      Object.values(T).forEach(st=>st.ucs.forEach(u=>{if(u.docente===d.nome)u.docente=v}))}
    d[f]=v;save();renderView();
  }
  else if(t.dataset.uc!==undefined){
    const u=S.ucs[+t.dataset.uc],f=t.dataset.f;let v=t.value.trim();
    if(f==="ch")v=Math.max(0,+v||0);
    if(f==="sigla"){v=v.toUpperCase();if(!v||S.ucs.some(x=>x!==u&&x.sigla===v)){toast("Sigla vazia ou já usada.");renderView();return}
      const old=u.sigla;Object.values(S.days).forEach(d=>d.s=(d.s||[]).map(x=>x===old?v:x))}
    u[f]=v;save();renderView();
    if(f==="docente"||f==="sigla"){const n=countConf();if(n)toast(`${n} choque(s) com bloqueios de docentes. Veja os avisos no Painel.`)}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="holName")UI.holName=e.target.value;if(e.target.id==="envMsg")UI.env.msg=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
window.addEventListener("hashchange",()=>location.reload());
renderView();
(async()=>{
  let db=null,u=null;
  try{db=window.claude&&await window.claude.use("db")}catch(e){}
  try{u=window.claude&&await window.claude.use("user")}catch(e){}
  try{UI.cw=u?u.can("data.write"):null}catch(e){}
  if(db&&UI.cw===false&&MODE==="planner"){MODE="landing";T={x:emptyTurma()};CUR="x";normalize()}
  try{DL=window.claude&&await window.claude.use("downloads")}catch(e){}
  UI.boot=false;
  if(!db){UI.err="Não foi possível carregar o calendário agora.";setStatus("local");renderView();return}
  if(MODE==="landing"){renderView();return}
  if(MODE==="planner")renderView();
  dref=db.collection("planejador");
  let first=true;
  dref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data()});
    const r=fromDocs(docs);
    if(MODE==="aluno"||MODE==="docente"){
      if(!Object.keys(r.t).length){UI.loaded=true;UI.empty=true;renderView();return}
      const prev=UI.loaded?canon([G,T,CUR]):null;
      G=r.g;T=r.t;const ids=Object.keys(T);
      CUR=MODE==="docente"?"":(ALUNO_ID&&T[ALUNO_ID]?ALUNO_ID:(ids.length===1?ids[0]:""));
      normalize();UI.savedAt=CUR&&docs["turma-"+CUR]?docs["turma-"+CUR].savedAt||"":(Object.values(docs).map(x=>x.savedAt||"").sort().pop()||"");UI.empty=false;
      const changed=prev!==null&&prev!==canon([G,T,CUR]);UI.loaded=true;renderView();
      if(changed)toast("Calendário atualizado");return;
    }
    if(!Object.keys(r.t).length){if(first){first=false;lastJson={};save()}return}
    first=false;
    if(dirty||document.querySelector(".modal"))return;
    const cand={G:r.g,T:r.t},cur=canon([docItems()]);
    const keep=CUR;G=r.g;T=r.t;CUR=T[keep]?keep:Object.keys(T)[0];normalize();
    const now=docItems();
    lastJson={};now.forEach(([k,d])=>{lastJson[k]=canon(d)});
    if(r.legacy)delete lastJson.geral;
    if(canon([now])===cur&&!r.legacy){setStatus("saved");return}
    persistLocal();renderView();
    if(r.legacy)save();else setStatus("saved");
  },()=>{if(MODE!=="planner"){UI.err="Não foi possível carregar o calendário agora.";renderView()}else setStatus("error")});
})();
</script>
