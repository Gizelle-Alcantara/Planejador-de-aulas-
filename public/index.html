<style>
/* Layout: cabeçalho da turma + abas; calendário mensal com pincel de disciplinas; tabelas densas para controle de aulas */
:root{
  --bg:#f2f5f9;--surface:#fff;--surface2:#f7f9fc;--ink:#14202e;--muted:#5a6b7f;--line:#d9e0ea;
  --accent:#0b5cab;--accent-ink:#fff;--ok:#1b7f4b;--warn:#a35f00;--bad:#b3261e;
  --wk:#eaeef4;--hol:#fde9e7;--sem:#eceaf6;
  --u0:#0b5cab;--u1:#1b8a5a;--u2:#b4531a;--u3:#7a4bc2;--u4:#c2368b;--u5:#0e8a9a;--u6:#8a7a12;--u7:#c0392b;
  --logo-bg:transparent;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;--f-body:"Public Sans","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1520;--surface:#15202d;--surface2:#1a2736;--ink:#e6edf5;--muted:#93a4b8;--line:#28364a;
  --accent:#5aa2ef;--accent-ink:#08121f;--ok:#4cc38a;--warn:#e3a23b;--bad:#f27b72;
  --wk:#1b2837;--hol:#3a2227;--sem:#252338;--logo-bg:#fff;
  --u0:#5aa2ef;--u1:#4cc38a;--u2:#ec9255;--u3:#b08cf0;--u4:#ee7fc1;--u5:#4fcad9;--u6:#cfbe45;--u7:#f27b72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1520;--surface:#15202d;--surface2:#1a2736;--ink:#e6edf5;--muted:#93a4b8;--line:#28364a;
  --accent:#5aa2ef;--accent-ink:#08121f;--ok:#4cc38a;--warn:#e3a23b;--bad:#f27b72;
  --wk:#1b2837;--hol:#3a2227;--sem:#252338;--logo-bg:#fff;
  --u0:#5aa2ef;--u1:#4cc38a;--u2:#ec9255;--u3:#b08cf0;--u4:#ee7fc1;--u5:#4fcad9;--u6:#cfbe45;--u7:#f27b72;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{padding-block:18px 0;display:flex;flex-direction:column;gap:12px}
.id{display:flex;flex-direction:column;gap:4px}
.hbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:6px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.id h1{font-size:1.4rem}
.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand .id{flex:1;min-width:0}
@media(max-width:720px){.brand .logo{order:0}#themeBtn{order:1;margin-left:auto}.brand .id{order:2;flex:1 1 100%}}
.logo{height:38px;width:auto;padding:4px 8px;border-radius:6px;background:var(--logo-bg);flex:none}
.stat{font-size:.78rem;color:var(--muted)}.stat[data-k=saved]{color:var(--ok)}.stat[data-k=error],.stat[data-k=ro]{color:var(--bad)}.stat[data-k=saving]{color:var(--warn)}
.id .meta{color:var(--muted);font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:18px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.banner{display:flex;gap:10px;align-items:center;border-radius:8px;padding:12px 16px;font-weight:600;border:1px solid}
.banner.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:var(--warn);color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.tile span{color:var(--muted);font-size:.8rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill.EM-ANDAMENTO{color:var(--accent);border-color:var(--accent)}
.pill.CONCLUÍDA{color:var(--ok);border-color:var(--ok)}
.pill.PLANEJADA{color:var(--muted);border-color:var(--line)}
.sig{display:inline-block;min-width:3.2em;text-align:center;font-family:var(--f-mono);font-size:.78rem;font-weight:500;padding:2px 6px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.bar{height:8px;background:var(--wk);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.bar.over i{background:var(--bad)}
ul.av{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.av li{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.warn{background:var(--warn)}.dot.err{background:var(--bad)}.dot.info{background:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:.8rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0;color:var(--ink);font-weight:400}
textarea{font-family:var(--f-mono);font-size:.8rem;min-height:140px;resize:vertical}
td input{padding:5px 7px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
/* calendar */
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.calbar h2{min-width:11ch;text-align:center}.calbar h2::first-letter{text-transform:uppercase}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-weight:500;font-size:.82rem}
.pal button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.pal button .sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:2px 4px}
.day{position:relative;min-height:84px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.day:hover{border-color:var(--accent)}
.day.wk{background:var(--wk)}
.day.out{opacity:.55}
.day.hol{background:var(--hol)}
.day.sem{background:var(--sem)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.day .lb{font-size:.68rem;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.day.blank{visibility:hidden}
.day.blk{background:repeating-linear-gradient(135deg,var(--wk),var(--wk) 6px,var(--surface) 6px,var(--surface) 12px)}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.card:hover{border-color:var(--accent)}
.chip{display:block;font-family:var(--f-mono);font-size:.7rem;padding:1px 4px;border-radius:3px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.bad{outline:1px dashed var(--bad)}
@media(max-width:620px){.day{min-height:62px;padding:3px}.chip{font-size:.62rem;padding:1px 2px}.day .lb{font-size:.6rem}}
/* modal */
.bdg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;border:1px solid currentColor;white-space:nowrap}.bdg.ok{color:var(--ok)}.bdg.warn{color:var(--warn)}.bdg.bad{color:var(--bad)}.bdg.mut{color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(5,10,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(100%,460px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
details>summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:1rem}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.82rem}
@media (prefers-reduced-motion:no-preference){.day,.btn{transition:border-color .12s}}
</style>

function calcOf(S){
  const c=S.cfg,hora=horaOf(c),isos=Object.keys(S.days).sort();
  const dates={},enc={},totals={};
  S.ucs.forEach(u=>dates[u.sigla]=[]);
  const reg=S.reg||{};
  for(const iso of isos){
    const d=S.days[iso];enc[iso]=[];const nao=reg[iso]&&reg[iso].dado==="nao";
    (d.s||[]).forEach(sg=>{if(nao){enc[iso].push("×");return}(dates[sg]=dates[sg]||[]).push(iso);const count=dayBlocks(S,iso).filter(b=>b.sigla===sg).reduce((n,b)=>n+b.quantidade,0),before=totals[sg]||0;totals[sg]=before+count;enc[iso].push(count>1?`${before+1}–${before+count}`:before+1)});
  }
  const cnt={};
  for(const [iso,r] of Object.entries(reg)){for(const sg of S.days[iso]?.s||[]){const count=dayBlocks(S,iso,true).filter(b=>b.sigla===sg).reduce((n,b)=>n+b.quantidade,0),k=cnt[sg]=cnt[sg]||{dadas:0,nao:0,semRep:0};if(r.dado==="sim")k.dadas+=count;else if(r.dado==="nao"){k.nao+=count;if(!r.rep)k.semRep+=count}}}

  const t=todayISO();
  const rows=S.ucs.map((u,i)=>{
    const Q=Math.ceil(hora===60?u.ch:u.ch*1.2),P=Q,R=Math.floor(Q*.25);
    const ds=dates[u.sigla]||[],ini=ds[0]||"-",fim=ds[ds.length-1]||"-";
    const status=ds.length&&t>=ini&&t<=fim?"EM ANDAMENTO":ds.length&&t>fim?"CONCLUÍDA":"PLANEJADA";
    const k=cnt[u.sigla]||{dadas:0,nao:0,semRep:0};
    return {u,i,Q,P,R,aloc:totals[u.sigla]||0,faltam:P-(totals[u.sigla]||0),ini,fim,status,ds,dadas:k.dadas,nao:k.nao,semRep:k.semRep};
  });
  return {rows,enc,dates,isos};
}
const PLUR=["domingos","segundas-feiras","terças-feiras","quartas-feiras","quintas-feiras","sextas-feiras","sábados"];

function blockMsg(iso,sg){
  const u=ucOf(sg);if(!u||SENAI_SCHEDULE.isEAD(u))return "";
  const d=u.docente?S.docentes.find(x=>x.nome===u.docente):null;
  const w=dow(iso);
  if(d){
    if((d.semana||[]).includes(w))return `${d.nome} não leciona ${w===0||w===6?"aos":"às"} ${PLUR[w]}`;
    const b=(d.bloqueios||[]).find(x=>x.de&&iso>=x.de&&iso<=(x.ate||x.de));
    if(b)return `${d.nome} está indisponível${b.motivo?" ("+b.motivo+")":""} de ${br(b.de)}${b.ate&&b.ate!==b.de?" a "+br(b.ate):""}`;
  }
  const sp1=spanOf(S.cfg),sala=normSala(u.sala);
  for(const st of Object.values(T)){
    if(st===S)continue;const dd=st.days[iso];if(!dd||!(dd.s||[]).length)continue;
    if(st.reg&&st.reg[iso]&&st.reg[iso].dado==="nao")continue;
    const sp2=spanOf(st.cfg);if(!(sp1[0]<sp2[1]&&sp2[0]<sp1[1]))continue;
    const ucs=dd.s.map(x=>st.ucs.find(u2=>u2.sigla===x)).filter(u=>u&&!SENAI_SCHEDULE.isEAD(u));
    if(d){const hit=ucs.find(u2=>u2.docente===u.docente);if(hit)return `${d.nome} já leciona ${hit.sigla} na turma ${st.cfg.turma} nesse horário`}
    if(sala){const hit=ucs.find(u2=>normSala(u2.sala)===sala);if(hit)return `a sala ${u.sala.trim()} já está ocupada por ${hit.sigla} (turma ${st.cfg.turma}) nesse horário`}

}
function confDay(iso){

  const s=(S.days[iso]||{}).s||[];const m=[];

function avisos(C){
  const a=[];
  C.rows.forEach(r=>{
    if(r.faltam>0)a.push(["warn",`${r.u.sigla}: faltam ${r.faltam} aula(s) para lançar (${r.aloc} de ${r.P}).`]);
    if(r.faltam<0)a.push(["err",`${r.u.sigla}: ${-r.faltam} aula(s) a mais que o previsto (${r.aloc} de ${r.P}).`]);
    if(!r.u.docente)a.push(["info",`${r.u.sigla}: sem docente definido.`]);
    if(r.semRep>0)a.push(["warn",`${r.u.sigla}: ${r.semRep} aula(s) não dada(s) sem reposição. Veja a aba Chamada.`]);
  });
  for(const iso of C.isos){
    const d=S.days[iso],s=d.s||[];if(!s.length)continue;
    const w=dow(iso);
    if(w===0||w===6)a.push(["warn",`Aula em ${WDL[w]}, ${br(iso)} (${s.join(", ")}).`]);
    if(s.some(sg=>SENAI_SCHEDULE.outsidePeriod(S,iso,sg)))a.push(["warn",`Aula fora do período da turma: ${br(iso)} (${s.join(", ")}).`]);

    s.forEach(sg=>{if(!ucOf(sg))a.push(["err",`Sigla "${sg}" em ${br(iso)} não existe nas disciplinas.`])});
    confDay(iso).forEach(m=>a.push(["err",`Choque em ${br(iso)}: ${m}.`]));
  }
  return a;
}

function saveTurma(){

  const cod=v("ntCod"),id=slug(cod);

  if(T[id])return err("Já existe uma turma com esse código.");
  if(!v("ntIni")||!v("ntFim"))return err("Informe as datas de início e término.");
  if(v("ntFim")<v("ntIni"))return err("O término precisa ser depois do início.");

  const st={cfg:{turma:cod,curso:v("ntCurso"),turno:v("ntTurno"),modulo:v("ntMod"),coord:v("ntCoord"),email:"",local:"",inicio:v("ntIni"),termino:v("ntFim"),aulasDia:Math.max(1,+v("ntAulas")||4),destinatarios:""},
    ucs:src?clone(src.ucs):v('ntCopy')==='__course__'?SENAI_COURSES.templateUnits(selectedCourse,G.docentes):[],days:{},envios:[]};
  if(selectedCourse)st.cfg.cursoId=selectedCourse.id;

  T[id]=st;CUR=id;normalize();UI.month=null;UI.ucFilter="";UI.tab=src?"calendario":"disciplinas";

 const options=request?.options||{sigla:document.getElementById('aUc').value,from:document.getElementById('aFrom').value,to:document.getElementById('aTo').value,quantity:Number(document.getElementById('aQty').value),weekdays:[...document.querySelectorAll('.aw:checked')].map(x=>Number(x.value))};

  modal.querySelector('button:not([disabled])')?.focus();

async function applyPlanning(button){

 const modal=button.closest('.modal'),error=modal.querySelector('#plan-error');

function buildMsg(p,canal){

function csvText(){const L=["Data;Dia;Sigla;Unidade curricular;Aulas;Início;Fim;Docente;Sala;Observação"],q=csvCell;for(const iso of Object.keys(S.days).sort())for(const b of dayBlocks(S,iso)){const u=ucOf(b.sigla)||{};L.push([br(iso),WD[dow(iso)],b.sigla,u.nome,b.quantidade,hm(b.inicio),hm(b.fim),u.docente,effectiveRoom(S,iso,b.sigla,b.bloco).join(" / "),S.days[iso].h].map(q).join(";"))}return L.join("\n")}
function icsText(){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planejador de Turma//PT-BR"];for(const iso of Object.keys(S.days).sort())for(const b of dayBlocks(S,iso)){const d=iso.replace(/-/g,"");L.push("BEGIN:VEVENT",`UID:${d}-${S.cfg.turma}-${b.sigla}-${b.bloco}@planejador`,`DTSTAMP:${d}T000000`,`DTSTART:${d}T${hm(b.inicio).replace(":","")}00`,`DTEND:${d}T${hm(b.fim).replace(":","")}00`,`SUMMARY:${b.sigla} - Turma ${S.cfg.turma}`,"END:VEVENT")}L.push("END:VCALENDAR");return L.join("\r\n")}

const fdt=iso=>{try{return new Date(iso).toLocaleString("pt-BR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}).replace(","," às")}catch(e){return ""}};
function roCells(ym,C){
  const [y,m]=ym.split("-").map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),t=todayISO();
  let cells=WD.map(d=>`<div class="h">${d}</div>`).join("");
  for(let i=0;i<first;i++)cells+=`<div class="day blank"></div>`;
  for(let d=1;d<=dim;d++){
    const iso=`${ym}-${String(d).padStart(2,"0")}`,e=S.days[iso]||{},w=dow(iso),s=e.s||[];
    const cl=["day"];if(w===0||w===6)cl.push("wk");if(iso<S.cfg.inicio||iso>S.cfg.termino)cl.push("out");if(e.t==="feriado")cl.push("hol");if(e.t==="sem")cl.push("sem");if(iso===t)cl.push("today");
    const chips=s.map((sg,j)=>{if(!calendarMatch(S,iso,sg,confDay(iso).length>0))return "";const u=ucOf(sg);return `<span ${agendaAttrs(u?.nome||sg,u?.docente,effectiveRoom(S,iso,sg).join(" / "),ucHours(S,iso,sg),S.reg?.[iso]?.dado==="nao")} class="chip" style="--c:${colorOf(sg)};${UI.fUc&&sg!==UI.fUc?"display:none":""}" title="${esc(u?u.nome:sg)}">${esc(sg)} ${C.enc[iso][j]}${Array.isArray(e.grade)?`<small>${esc(ucHours(S,iso,sg))}</small>`:""}</span>`}).join("");
    cells+=`<div data-iso="${iso}" class="${cl.join(" ")}"><span class="dn">${d}</span>${e.h?`<span class="lb">${esc(e.h)}</span>`:""}${chips}</div>`;
  }
  return cells;
}

function vDiagnostics(){

 if(data.loading)return header+'<section class="panel"><p role="status">Consultando ocorrências…</p></section>';

}

 function failure(button,kind,error){const root=$('#modalRoot');let notice=$('#xlsx-failure');if(!notice){notice=document.createElement('div');notice.id='xlsx-failure';notice.className='banner warn';notice.setAttribute('role','alert');root.querySelector('.modal')?.append(notice)}notice.replaceChildren();const text=document.createElement('p');text.textContent=error.message||'Não foi possível abrir a prévia.';notice.append(text);if(/gravação|Escolha|conta|somente|permissão/i.test(text.textContent))return;const fallback=document.createElement('button');fallback.className='btn';fallback.type='button';fallback.textContent='Baixar Excel sem prévia';fallback.onclick=()=>downloadCalendarFallback(fallback,kind);notice.append(fallback);notice.scrollIntoView({block:'nearest'})}
 async function downloadCalendarFallback(button,kind){button.disabled=true;try{const url=makeUrl(kind);if(!url)return;url.searchParams.set('export',kind==='docente'?'docente-xlsx':'xlsx');await saveFile(url,kind==='docente'?`calendario-docente-${slug(url.searchParams.get('docente'))}-${url.searchParams.get('ano')}.xlsx`:`calendario-senai-${CUR}.xlsx`)}catch(error){toast(error.message)}finally{button.disabled=false}}
 async function saveFile(url,filename){const response=await fetch(url,{credentials:'same-origin',cache:'no-store'});if(!response.ok){const data=await response.json().catch(()=>({}));throw new Error(data.error||`Não foi possível baixar o Excel (HTTP ${response.status}).`)}const blob=await response.blob();if(!blob.size)throw new Error('O servidor retornou um arquivo vazio.');const signature=new Uint8Array(await blob.slice(0,2).arrayBuffer());if(signature[0]!==80||signature[1]!==75)throw new Error('O servidor retornou uma página em vez do Excel. Confira a instalação da API.');const object=URL.createObjectURL(blob),link=document.createElement('a');link.href=object;link.download=filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(object),30000);toast('Download do Excel iniciado.');}

 function firstMonth(sheet){return sheet.months.find(m=>m.key===UI.month)?.key||sheet.months.find(m=>m.hasLessons)?.key||sheet.months[0]?.key||''}
 function matrix(sheet){const chosen=sheet.months.find(m=>m.key===month),first=sheet.months[0]?.start;const rows=sheet.rows.filter(r=>!r.hidden&&(!chosen||r.number<first||r.number>=chosen.start&&r.number<chosen.end||sheet.summary&&r.number>=sheet.summary));
  const covered=new Set(),anchors=new Map();for(const merge of sheet.merges){anchors.set(`${merge.row}/${merge.col}`,merge);for(let r=merge.row;r<merge.row+merge.rows;r++)for(let c=merge.col;c<merge.col+merge.cols;c++)if(r!==merge.row||c!==merge.col)covered.add(`${r}/${c}`)}
  return `<table class="xlsx-table"><caption>${e(sheet.name)}${chosen?' · '+e(chosen.label):''}</caption><colgroup>${sheet.widths.map(w=>`<col style="width:${Math.max(22,(w*7+5)*zoom)}px">`).join('')}</colgroup><tbody>${rows.map(row=>{const cells=new Map(row.cells.map(c=>[c.col,c]));let html='';for(let col=1;col<=sheet.maxCol;col++){const key=`${row.number}/${col}`;if(covered.has(key))continue;const cell=cells.get(col),style=current.data.styles[cell?.style||0]||{},merge=anchors.get(key),font=style.font||{};const css=`background:${style.fill||'#ffffff'};color:${readable(font.color,style.fill)};font-weight:${font.bold?'700':'400'};font-size:${Math.max(10,font.size*1.333*zoom||12)}px;text-align:${['left','right','center'].includes(style.align)?style.align:'center'};`;const columnHeader=sheet.months.some(m=>row.number===m.start+1||row.number===m.start+2)||sheet.summary&&(row.number===sheet.summary||row.number===sheet.summary+1)||!sheet.months.length&&row.number===1,rowHeader=!columnHeader&&!!cell?.text&&(sheet.summary&&row.number>sheet.summary+1&&col===1||first&&row.number>first+2&&row.number<(sheet.summary||Infinity)&&col<=2),tag=columnHeader||rowHeader?'th':'td';html+=`<${tag} ${columnHeader?'scope="col"':rowHeader?'scope="row"':''} ${merge?`rowspan="${merge.rows}" colspan="${merge.cols}"`:''} style="${css}">${style.rotation===90?`<span class="xlsx-vertical">${e(cell?.text||'')}</span>`:e(cell?.text||'')}</${tag}>`}return `<tr style="height:${Math.max(18,row.height*1.333*zoom)}px">${html}</tr>`}).join('')}</tbody></table>`;
 }
 function render(){const sheet=current.data.sheets[sheetIndex];const root=$('#modalRoot');root.innerHTML=`<div class="ov" data-act="mclose"><div class="modal xlsx-modal" role="dialog" aria-label="Prévia do Excel"><h2>${e(current.data.title)}</h2><p class="small muted">Confira os dados e a estrutura do arquivo antes de baixar.</p>${current.data.conflicts?`<p class="banner warn">${current.data.conflicts} célula(s) com conflito. Confira a distribuição das aulas.</p>`:''}<div class="xlsx-tools"><label class="f">Planilha<select id="xlsx-sheet" aria-label="Planilha da prévia">${current.data.sheets.map((s,i)=>`<option value="${i}" ${i===sheetIndex?'selected':''}>${e(s.name)}</option>`).join('')}</select></label>${sheet.months.length?`<label class="f">Mês<select id="xlsx-month" aria-label="Mês da prévia"><option value="">Todos os meses</option>${sheet.months.map(m=>`<option value="${e(m.key)}" ${m.key===month?'selected':''}>${e(m.label)}</option>`).join('')}</select></label>`:''}<label class="f">Zoom<select id="xlsx-zoom" aria-label="Zoom da prévia">${[.75,1,1.25,1.5].map(z=>`<option value="${z}" ${z===zoom?'selected':''}>${z*100}%</option>`).join('')}</select></label></div><p class="small muted">Deslize para os lados para conferir as colunas. O resumo das disciplinas aparece abaixo do mês.</p><div class="xlsx-scroll" tabindex="0" role="region" aria-label="Conteúdo da planilha ${e(sheet.name)}">${matrix(sheet)}</div><div class="row xlsx-actions"><button class="btn" id="xlsx-back">Voltar às opções</button><button class="btn" id="xlsx-refresh">Atualizar prévia</button><button class="btn pri" id="xlsx-download">Baixar Excel</button></div><p id="xlsx-status" role="status" class="small"></p></div></div>`;
  $('#xlsx-sheet').onchange=event=>{sheetIndex=Number(event.target.value);month=firstMonth(current.data.sheets[sheetIndex]);render();queueMicrotask(()=>$('#xlsx-sheet')?.focus())};const monthSelect=$('#xlsx-month');if(monthSelect)monthSelect.onchange=event=>{month=event.target.value;render();queueMicrotask(()=>$('#xlsx-month')?.focus())};$('#xlsx-zoom').onchange=event=>{zoom=Number(event.target.value);render();queueMicrotask(()=>$('#xlsx-zoom')?.focus())};$('#xlsx-back').onclick=()=>{current=null;root.innerHTML=returnMarkup;returnValues.forEach(v=>{const el=document.getElementById(v.id);if(el){el.value=v.value;if(el.type==='checkbox')el.checked=v.checked}});queueMicrotask(()=>$(`[data-act="${returnFocus}"]`)?.focus())};$('#xlsx-refresh').onclick=refresh;$('#xlsx-download').onclick=download;
 }
 async function refresh(){const snapshot=current,button=$('#xlsx-refresh');button.disabled=true;message('Atualizando prévia…');try{const data=await request(snapshot.url);if(current!==snapshot||!$('#xlsx-refresh'))return;current.data=data;sheetIndex=Math.min(sheetIndex,current.data.sheets.length-1);const sheet=current.data.sheets[sheetIndex];if(month&&!sheet.months.some(m=>m.key===month))month=firstMonth(sheet);render();queueMicrotask(()=>$('#xlsx-refresh')?.focus());message('Prévia atualizada.')}catch(error){message(error.message);button.disabled=false}}
 async function download(){const snapshot=current,button=$('#xlsx-download'),url=new URL(snapshot.url);url.searchParams.set('export',url.searchParams.get('export')==='docente-preview'?'docente-xlsx':'xlsx');url.searchParams.set('versao',snapshot.data.version);button.disabled=true;message('Preparando download…');try{const response=await fetch(url,{credentials:'same-origin',cache:'no-store'});if(!response.ok){const j=await response.json().catch(()=>({}));throw new Error(j.error||'Não foi possível baixar o arquivo.')}const object=URL.createObjectURL(await response.blob()),link=document.createElement('a');link.href=object;link.download=snapshot.data.filename;document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(object),1000);if(current===snapshot)message('Excel baixado.')}catch(error){message(error.message)}finally{button.disabled=false}}
 window.openExcelPreview=async(button,kind)=>{const label=button.textContent;button.disabled=true;button.textContent='Preparando prévia…';$('#xlsx-failure')?.remove();try{const url=makeUrl(kind);if(!url)return;const data=await request(url);if(!button.isConnected)return;button.disabled=false;button.textContent=label;returnValues=[...$('#modalRoot').querySelectorAll('input[id],select[id]')].map(el=>({id:el.id,value:el.value,checked:el.checked}));returnMarkup=$('#modalRoot').innerHTML;returnFocus=button.dataset.act;current={url,data};sheetIndex=0;month=firstMonth(data.sheets[0]);render()}catch(error){failure(button,kind,error);toast(error.message)}finally{button.disabled=false;button.textContent=label}};
})();
</script></body></html>
