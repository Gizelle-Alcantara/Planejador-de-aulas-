<style>
/* Layout: cabeçalho da turma + abas; calendário mensal com pincel de disciplinas; tabelas densas para controle de encontros */
:root{
  --bg:#f2f5f9;--surface:#fff;--surface2:#f7f9fc;--ink:#14202e;--muted:#5a6b7f;--line:#d9e0ea;
  --accent:#0b5cab;--accent-ink:#fff;--ok:#1b7f4b;--warn:#a35f00;--bad:#b3261e;
  --wk:#eaeef4;--hol:#fde9e7;--sem:#eceaf6;
  --u0:#0b5cab;--u1:#1b8a5a;--u2:#b4531a;--u3:#7a4bc2;--u4:#c2368b;--u5:#0e8a9a;--u6:#8a7a12;--u7:#c0392b;
  --logo-bg:transparent;
  --f-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;--f-body:"Public Sans","Segoe UI",system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1520;--surface:#15202d;--surface2:#1a2736;--ink:#e6edf5;--muted:#93a4b8;--line:#28364a;
  --accent:#5aa2ef;--accent-ink:#08121f;--ok:#4cc38a;--warn:#e3a23b;--bad:#f27b72;
  --wk:#1b2837;--hol:#3a2227;--sem:#252338;--logo-bg:#fff;
  --u0:#5aa2ef;--u1:#4cc38a;--u2:#ec9255;--u3:#b08cf0;--u4:#ee7fc1;--u5:#4fcad9;--u6:#cfbe45;--u7:#f27b72;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1520;--surface:#15202d;--surface2:#1a2736;--ink:#e6edf5;--muted:#93a4b8;--line:#28364a;
  --accent:#5aa2ef;--accent-ink:#08121f;--ok:#4cc38a;--warn:#e3a23b;--bad:#f27b72;
  --wk:#1b2837;--hol:#3a2227;--sem:#252338;--logo-bg:#fff;
  --u0:#5aa2ef;--u1:#4cc38a;--u2:#ec9255;--u3:#b08cf0;--u4:#ee7fc1;--u5:#4fcad9;--u6:#cfbe45;--u7:#f27b72;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;padding-inline:16px;padding-block:0 40px}
.wrap{max-width:1180px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.25rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header.top{padding-block:18px 0;display:flex;flex-direction:column;gap:12px}
.id{display:flex;flex-direction:column;gap:4px}
.hbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:6px}
a.btn{text-decoration:none;color:var(--ink);display:inline-block}
.id h1{font-size:1.4rem}
.brand{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand .id{flex:1;min-width:0}
@media(max-width:720px){.brand .logo{order:0}#themeBtn{order:1;margin-left:auto}.brand .id{order:2;flex:1 1 100%}}
.logo{height:38px;width:auto;padding:4px 8px;border-radius:6px;background:var(--logo-bg);flex:none}
.stat{font-size:.78rem;color:var(--muted)}.stat[data-k=saved]{color:var(--ok)}.stat[data-k=error],.stat[data-k=ro]{color:var(--bad)}.stat[data-k=saving]{color:var(--warn)}
.id .meta{color:var(--muted);font-size:.85rem}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line)}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs button[aria-selected=true]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:18px;display:flex;flex-direction:column;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel>h2,.panel>h3{margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:18px}
.banner{display:flex;gap:10px;align-items:center;border-radius:8px;padding:12px 16px;font-weight:600;border:1px solid}
.banner.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok);color:var(--ok)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--surface));border-color:var(--warn);color:var(--warn)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.tile b{display:block;font-family:var(--f-display);font-size:1.6rem;line-height:1.1}
.tile span{color:var(--muted);font-size:.8rem}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.72rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill.EM-ANDAMENTO{color:var(--accent);border-color:var(--accent)}
.pill.CONCLUÍDA{color:var(--ok);border-color:var(--ok)}
.pill.PLANEJADA{color:var(--muted);border-color:var(--line)}
.sig{display:inline-block;min-width:3.2em;text-align:center;font-family:var(--f-mono);font-size:.78rem;font-weight:500;padding:2px 6px;border-radius:4px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.bar{height:8px;background:var(--wk);border-radius:99px;overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px}
.bar.over i{background:var(--bad)}
ul.av{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
ul.av li{display:flex;gap:8px;align-items:baseline}
.dot{width:8px;height:8px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dot.warn{background:var(--warn)}.dot.err{background:var(--bad)}.dot.info{background:var(--muted)}
.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:.8rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=date],input[type=number],input[type=email],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%;min-width:0;color:var(--ink);font-weight:400}
textarea{font-family:var(--f-mono);font-size:.8rem;min-height:140px;resize:vertical}
td input{padding:5px 7px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}
/* calendar */
.calbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.calbar h2{min-width:11ch;text-align:center}.calbar h2::first-letter{text-transform:uppercase}
.pal{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pal button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:5px 10px;font-weight:500;font-size:.82rem}
.pal button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.pal button .sw{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:2px 4px}
.day{position:relative;min-height:84px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px;display:flex;flex-direction:column;gap:3px;min-width:0;overflow:hidden}
.day:hover{border-color:var(--accent)}
.day.wk{background:var(--wk)}
.day.out{opacity:.55}
.day.hol{background:var(--hol)}
.day.sem{background:var(--sem)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day .dn{font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.day .lb{font-size:.68rem;line-height:1.2;color:var(--ink);overflow-wrap:anywhere}
.day.blank{visibility:hidden}
.day.blk{background:repeating-linear-gradient(135deg,var(--wk),var(--wk) 6px,var(--surface) 6px,var(--surface) 12px)}
.card{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px}
.card:hover{border-color:var(--accent)}
.chip{display:block;font-family:var(--f-mono);font-size:.7rem;padding:1px 4px;border-radius:3px;background:color-mix(in srgb,var(--c) 20%,var(--surface));border-left:3px solid var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.bad{outline:1px dashed var(--bad)}
@media(max-width:620px){.day{min-height:62px;padding:3px}.chip{font-size:.62rem;padding:1px 2px}.day .lb{font-size:.6rem}}
/* modal */
.bdg{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.74rem;border:1px solid currentColor;white-space:nowrap}.bdg.ok{color:var(--ok)}.bdg.warn{color:var(--warn)}.bdg.bad{color:var(--bad)}.bdg.mut{color:var(--muted)}
.ov{position:fixed;inset:0;background:rgba(5,10,18,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;width:min(100%,460px);max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:500;z-index:30;max-width:calc(100% - 32px)}
.muted{color:var(--muted)}
.small{font-size:.8rem}
details>summary{cursor:pointer;font-weight:600;font-family:var(--f-display);font-size:1rem}
.wds{display:flex;flex-wrap:wrap;gap:6px}
.wds label{display:flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:.82rem}
@media (prefers-reduced-motion:no-preference){.day,.btn{transition:border-color .12s}}
</style>

function calcOf(S){
  const c=S.cfg,hora=horaOf(c),isos=Object.keys(S.days).sort();
  const dates={},enc={};
  S.ucs.forEach(u=>dates[u.sigla]=[]);
  const reg=S.reg||{};
  for(const iso of isos){
    const d=S.days[iso];enc[iso]=[];const nao=reg[iso]&&reg[iso].dado==="nao";
    (d.s||[]).forEach(sg=>{if(nao){enc[iso].push("×");return}(dates[sg]=dates[sg]||[]).push(iso);enc[iso].push(dates[sg].length)});
  }
  const cnt={};
  for(const [iso,r] of Object.entries(reg)){const sg=((S.days[iso]||{}).s||[])[0];if(!sg)continue;const c=cnt[sg]=cnt[sg]||{dadas:0,nao:0,semRep:0};
    if(r.dado==="sim")c.dadas++;else if(r.dado==="nao"){c.nao++;if(!r.rep)c.semRep++}}
  const t=todayISO();
  const rows=S.ucs.map((u,i)=>{
    const Q=Math.ceil(hora===60?u.ch:u.ch*1.2),P=Math.ceil(Q/c.aulasDia),R=Math.floor(Q*.25);
    const ds=dates[u.sigla]||[],ini=ds[0]||"-",fim=ds[ds.length-1]||"-";
    const status=ds.length&&t>=ini&&t<=fim?"EM ANDAMENTO":ds.length&&t>fim?"CONCLUÍDA":"PLANEJADA";
    const k=cnt[u.sigla]||{dadas:0,nao:0,semRep:0};
    return {u,i,Q,P,R,aloc:ds.length,faltam:P-ds.length,ini,fim,status,ds,dadas:k.dadas,nao:k.nao,semRep:k.semRep};
  });
  return {rows,enc,dates,isos};
}
const PLUR=["domingos","segundas-feiras","terças-feiras","quartas-feiras","quintas-feiras","sextas-feiras","sábados"];
const normSala=s=>String(s||"").trim().toLowerCase();
function blockMsg(iso,sg){
  const u=ucOf(sg);if(!u)return "";
  const d=u.docente?S.docentes.find(x=>x.nome===u.docente):null;
  const w=dow(iso);
  if(d){
    if((d.semana||[]).includes(w))return `${d.nome} não leciona ${w===0||w===6?"aos":"às"} ${PLUR[w]}`;
    const b=(d.bloqueios||[]).find(x=>x.de&&iso>=x.de&&iso<=(x.ate||x.de));
    if(b)return `${d.nome} está indisponível${b.motivo?" ("+b.motivo+")":""} de ${br(b.de)}${b.ate&&b.ate!==b.de?" a "+br(b.ate):""}`;
  }
  const sp1=spanOf(S.cfg),sala=normSala(u.sala);
  for(const st of Object.values(T)){
    if(st===S)continue;const dd=st.days[iso];if(!dd||!(dd.s||[]).length)continue;
    if(st.reg&&st.reg[iso]&&st.reg[iso].dado==="nao")continue;
    const sp2=spanOf(st.cfg);if(!(sp1[0]<sp2[1]&&sp2[0]<sp1[1]))continue;
    const ucs=dd.s.map(x=>st.ucs.find(u2=>u2.sigla===x)).filter(Boolean);
    if(d){const hit=ucs.find(u2=>u2.docente===u.docente);if(hit)return `${d.nome} já leciona ${hit.sigla} na turma ${st.cfg.turma} nesse horário`}
    if(sala){const hit=ucs.find(u2=>normSala(u2.sala)===sala);if(hit)return `a sala ${u.sala.trim()} já está ocupada por ${hit.sigla} (turma ${st.cfg.turma}) nesse horário`}
  }
  return "";
}
function confDay(iso){
  const s=(S.days[iso]||{}).s||[];const m=[];
  if(s.length>1)m.push(`mais de uma disciplina no mesmo dia (${s.join(" e ")})`);
  s.forEach(sg=>{const b=blockMsg(iso,sg);if(b)m.push(b)});
  return m;
}
const countConf=()=>Object.keys(S.days).reduce((a,i)=>a+confDay(i).length,0);
function avisos(C){
  const a=[];
  C.rows.forEach(r=>{
    if(r.faltam>0)a.push(["warn",`${r.u.sigla}: faltam ${r.faltam} encontro(s) para lançar (${r.aloc} de ${r.P}).`]);
    if(r.faltam<0)a.push(["err",`${r.u.sigla}: ${-r.faltam} encontro(s) a mais que o previsto (${r.aloc} de ${r.P}).`]);
    if(!r.u.docente)a.push(["info",`${r.u.sigla}: sem docente definido.`]);
    if(r.semRep>0)a.push(["warn",`${r.u.sigla}: ${r.semRep} aula(s) não dada(s) sem reposição. Veja a aba Chamada.`]);
  });
  for(const iso of C.isos){
    const d=S.days[iso],s=d.s||[];if(!s.length)continue;
    const w=dow(iso);
    if(w===0||w===6)a.push(["warn",`Aula em ${WDL[w]}, ${br(iso)} (${s.join(", ")}).`]);
    if(iso<S.cfg.inicio||iso>S.cfg.termino)a.push(["warn",`Aula fora do período da turma: ${br(iso)} (${s.join(", ")}).`]);
    if(d.t==="feriado"||d.t==="sem")a.push(["err",`Aula marcada em dia sem aula: ${br(iso)}.`]);
    s.forEach(sg=>{if(!ucOf(sg))a.push(["err",`Sigla "${sg}" em ${br(iso)} não existe nas disciplinas.`])});
    confDay(iso).forEach(m=>a.push(["err",`Choque em ${br(iso)}: ${m}.`]));
  }
  return a;
}

function dayClick(iso){
  const tool=UI.tool;let e=S.days[iso]||{s:[]};e.s=e.s||[];
  if(tool==="edit"){openDayModal(iso);return}
  if(tool==="erase"){delete S.days[iso]}
  else if(tool==="feriado"||tool==="sem"){S.days[iso]={s:[],t:tool,h:UI.holName||(tool==="sem"?"SEM AULA":"FERIADO")}}
  else if(tool.startsWith("uc:")){
    const sg=tool.slice(3);
    if(e.t==="feriado"||e.t==="sem"){toast("Dia marcado como "+(e.t==="sem"?"sem aula":"feriado")+". Limpe o dia antes.");return}
    const k=e.s.lastIndexOf(sg);
    if(k>=0){e.s.splice(k,1)}
    else if(e.s.length){toast(`Choque: o dia já tem ${e.s[0]}. Remova antes de lançar outra disciplina.`);return}
    else{const m=blockMsg(iso,sg);if(m){toast("Choque: "+m+".");return}e.s.push(sg)}
    if(!e.s.length&&!e.h)delete S.days[iso];else S.days[iso]=e;
  }
  save();renderView();

function saveTurma(){

function autoAlloc(){
  const sg=document.getElementById("aUc").value,from=document.getElementById("aFrom").value;
  let qty=+document.getElementById("aQty").value;
  const wds=[...document.querySelectorAll(".aw:checked")].map(x=>+x.value);
  if(!sg||!from||!qty||!wds.length){toast("Informe disciplina, data, quantidade e dias da semana.");return}
  let iso=from,n=0,last="",guard=0,pul=0;
  while(n<qty&&guard++<800){
    const e=S.days[iso]||{s:[]};
    if(wds.includes(dow(iso))&&e.t!=="feriado"&&e.t!=="sem"&&!(e.s||[]).length){
      if(blockMsg(iso,sg))pul++;
      else{e.s=[sg];S.days[iso]=e;n++;last=iso}
    }
    iso=addD(iso,1);
  }
  save();toast(`${n} encontro(s) lançado(s)${last?" até "+br(last):""}${pul?` · ${pul} dia(s) pulado(s) por bloqueio do docente`:""}${n<qty?" · período esgotado antes de completar":""}.`);renderView();
}

function csvText(){
  const C=calc(),P=Object.fromEntries(C.rows.map(r=>[r.u.sigla,r.P])),L=["Data;Dia;Sigla;Unidade curricular;Encontro;Docente;Sala;Observação"];
  for(const iso of C.isos)(S.days[iso].s||[]).forEach((sg,j)=>{const u=ucOf(sg)||{};L.push([br(iso),WD[dow(iso)],sg,u.nome||"",`${C.enc[iso][j]}/${P[sg]??"?"}`,u.docente||"",u.sala||"",S.days[iso].h||""].join(";"))});
  return L.join("\n");
}
function icsText(){
  const C=calc(),h=horarios(),a=hm(h[0].i).replace(":","")+"00",b=hm(h[h.length-1].f).replace(":","")+"00";
  const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Planejador de Turma//PT-BR"];
  for(const iso of C.isos){const s=[...new Set(S.days[iso].s||[])];if(!s.length)continue;const d=iso.replace(/-/g,"");
    L.push("BEGIN:VEVENT",`UID:${d}-${S.cfg.turma}@planejador`,`DTSTAMP:${d}T000000`,`DTSTART:${d}T${a}`,`DTEND:${d}T${b}`,`SUMMARY:${s.join(" + ")} - Turma ${S.cfg.turma}`,"END:VEVENT")}
  L.push("END:VCALENDAR");return L.join("\r\n");
}

function roCells(ym,C){
  const [y,m]=ym.split("-").map(Number),first=new Date(Date.UTC(y,m-1,1)).getUTCDay(),dim=new Date(Date.UTC(y,m,0)).getUTCDate(),t=todayISO();
  let cells=WD.map(d=>`<div class="h">${d}</div>`).join("");
  for(let i=0;i<first;i++)cells+=`<div class="day blank"></div>`;
  for(let d=1;d<=dim;d++){
    const iso=`${ym}-${String(d).padStart(2,"0")}`,e=S.days[iso]||{},w=dow(iso),s=e.s||[];
    const cl=["day"];if(w===0||w===6)cl.push("wk");if(iso<S.cfg.inicio||iso>S.cfg.termino)cl.push("out");if(e.t==="feriado")cl.push("hol");if(e.t==="sem")cl.push("sem");if(iso===t)cl.push("today");
    const chips=s.map((sg,j)=>{const u=ucOf(sg);return `<span class="chip" style="--c:${colorOf(sg)};${UI.fUc&&sg!==UI.fUc?"opacity:.2":""}" title="${esc(u?u.nome:sg)}">${esc(sg)} ${C.enc[iso][j]}</span>`}).join("");
    cells+=`<div class="${cl.join(" ")}"><span class="dn">${d}</span>${e.h?`<span class="lb">${esc(e.h)}</span>`:""}${chips}</div>`;
  }
  return cells;
}

/* ---------- RELATÓRIOS ---------- */
function vRel(){
  const mes=ym=>{const [y,m]=ym.split("-").map(Number);return new Date(Date.UTC(y,m-1,1)).toLocaleDateString("pt-BR",{month:"long",year:"numeric",timeZone:"UTC"})};
  const pct=(a,b)=>b?Math.round(a/b*100)+"%":"-";
  const tr=Object.entries(T).map(([id,st])=>{const C=calcOf(st),P=C.rows.reduce((a,r)=>a+r.P,0),A=C.rows.reduce((a,r)=>a+r.aloc,0),ch=st.ucs.reduce((a,u)=>a+(+u.ch||0),0),sem=C.rows.filter(r=>!r.u.docente).length;
    return `<tr><td>${esc(st.cfg.turma)}</td><td>${esc(st.cfg.curso)}</td><td>${esc(st.cfg.turno)}</td><td class="n mono">${ch}</td><td class="n mono">${A} / ${P}</td><td class="n mono">${pct(A,P)}</td><td class="n mono">${sem}</td></tr>`}).join("");
  const dr=S.docentes.map(d=>{let ts=new Set(),sg=[],A=0,P=0,HA=0,HP=0;
    Object.values(T).forEach(st=>{const C=calcOf(st);C.rows.filter(r=>r.u.docente===d.nome).forEach(r=>{ts.add(st.cfg.turma);sg.push(r.u.sigla);A+=r.aloc;P+=r.P;HA+=r.aloc*st.cfg.aulasDia;HP+=r.P*st.cfg.aulasDia})});
    return `<tr><td>${esc(d.nome)}</td><td>${esc([...ts].join(", ")||"-")}</td><td>${esc(sg.join(", ")||"-")}</td><td class="n mono">${A} / ${P}</td><td class="n mono">${HA} / ${HP}</td><td>${(d.semana||[]).length?esc((d.semana||[]).map(w=>WD[w]).join(", ")):"-"}</td></tr>`}).join("");
  const isos=Object.keys(S.days),months={};
  for(let d=S.cfg.inicio;d&&d<=S.cfg.termino;d=addD(d,1)){const w=dow(d);if(w===0||w===6)continue;const ym=d.slice(0,7),e=S.days[d]||{};const m=months[ym]=months[ym]||{u:0,off:0,aula:0};m.u++;if(e.t==="feriado"||e.t==="sem")m.off++;else if((e.s||[]).length)m.aula++}
  const mr=Object.entries(months).map(([ym,m])=>`<tr><td style="text-transform:capitalize">${mes(ym)}</td><td class="n mono">${m.u}</td><td class="n mono">${m.off}</td><td class="n mono">${m.aula}</td><td class="n mono">${m.u-m.off-m.aula}</td><td class="n mono">${pct(m.aula,m.u-m.off)}</td></tr>`).join("");
  return `<section class="panel"><h2>Andamento por turma</h2><div class="tw"><table><thead><tr><th>Turma</th><th>Curso</th><th>Turno</th><th class="n">CH (h)</th><th class="n">Encontros lançados / previstos</th><th class="n">Lançado</th><th class="n">Disciplinas sem docente</th></tr></thead><tbody>${tr}</tbody></table></div></section>
  <section class="panel"><h2>Carga por docente (todas as turmas)</h2><div class="tw"><table><thead><tr><th>Docente</th><th>Turmas</th><th>Disciplinas</th><th class="n">Encontros lançados / previstos</th><th class="n">Horas-aula lançadas / previstas</th><th>Dias bloqueados</th></tr></thead><tbody>${dr}</tbody></table></div><p class="small muted">Horas-aula = encontros × aulas por dia de cada turma.</p></section>
  <section class="panel"><h2>Ocupação por mês — turma ${esc(S.cfg.turma)}</h2><div class="tw"><table><thead><tr><th>Mês</th><th class="n">Dias úteis</th><th class="n">Feriados / sem aula</th><th class="n">Com aula</th><th class="n">Livres</th><th class="n">Ocupação</th></tr></thead><tbody>${mr||'<tr><td colspan="6" class="muted">Defina início e término na aba Turma.</td></tr>'}</tbody></table></div><p class="small muted">Dias livres são úteis sem aula lançada: úteis para reposição.</p></section>`;
}

  else if(a==="bkfull"){const o=JSON.stringify({geral:G,turmas:strippedT()},null,1);DL.save({filename:`backup-planejador-${todayISO()}.json`,data:o}).then(()=>toast("Backup salvo"),er=>{if(!er||er.code!=="declined")toast("Não foi possível salvar o arquivo.")})}
  else if(a==="usradd"){const g=id=>document.getElementById(id).value;PLAN.api({op:"user_add",login:g("uLogin"),nome:g("uNome"),password:g("uPw"),role:g("uRole")}).then(r=>{toast(r.ok?"Conta criada":r.error||"Erro ao criar a conta");if(r.ok)loadAcc()})}
  else if(a==="usrdel"){const lg=b.dataset.l;if(UI.confirm==="u"+lg){UI.confirm=null;PLAN.api({op:"user_del",login:lg}).then(r=>{toast(r.ok?"Conta removida":r.error||"Erro");loadAcc()})}else{UI.confirm="u"+lg;renderView()}}
  else if(a==="usrpw"){const lg=b.dataset.l,pw=document.getElementById("pw_"+lg).value;PLAN.api({op:"user_pw",login:lg,password:pw}).then(r=>toast(r.ok?"Senha alterada":r.error||"Erro"))}
  else if(a==="histload")loadAcc();
  else if(a==="histrestore"){const id=b.dataset.h;if(UI.confirm==="h"+id){UI.confirm=null;PLAN.api({op:"restore",hid:+id}).then(r=>{if(r.ok){toast("Versão restaurada. Recarregando…");setTimeout(()=>location.reload(),900)}else toast(r.error||"Erro ao restaurar")})}else{UI.confirm="h"+id;renderView()}}
  else if(a==="avsend"){if(b.dataset.kind==="manual"&&UI.confirm!=="avsend"){UI.avSubj=document.getElementById("avSubj").value;UI.avText=document.getElementById("avText").value;UI.confirm="avsend";renderView();return}avSend(b.dataset.kind)}
  else if(a==="avbase"){PLAN.api({op:"notify_baseline",turma:CUR}).then(()=>{toast("Pronto: as próximas alterações serão avisadas.");UI.av=null;renderView()})}
  else if(a==="bkrun"){PLAN.api({op:"backup_now"}).then(r=>{toast(r.ok?"Backup feito":r.error||"Erro ao fazer o backup");loadBk()})}
  else if(a==="bkreload")loadBk();
  else if(a==="bkdl"){PLAN.api({op:"backup_download",id:+b.dataset.id}).then(r=>{if(!r.ok){toast(r.error||"Erro");return}const it=(UI.bk.items||[]).find(x=>x.id===+b.dataset.id);DL.save({filename:`backup-planejador-${(it?it.at:todayISO()).slice(0,10)}.json`,data:r.data}).then(()=>toast("Arquivo salvo"),er=>{if(!er||er.code!=="declined")toast("Não foi possível salvar o arquivo.")})})}
  else if(a==="bkres"){const id=b.dataset.id;if(UI.confirm==="bk"+id){UI.confirm=null;PLAN.api({op:"backup_restore",id:+id}).then(r=>{if(r.ok){toast("Backup restaurado. Recarregando…");setTimeout(()=>location.reload(),900)}else toast(r.error||"Erro ao restaurar")})}else{UI.confirm="bk"+id;renderView()}}
  else if(a==="regopen")openRegModal(b.dataset.iso);
  else if(a==="rsave")saveReg();
  else if(a==="rall")document.querySelectorAll("[data-fa]").forEach(s=>s.value="0");
  else if(a==="rep"){if(applyRep(b.dataset.o,b.dataset.n)){save();renderView();toast("Reposição lançada em "+br(b.dataset.n))}}
  else if(a==="repauto")repAuto();
  else if(a==="alunoadd"){const ls=document.getElementById("alLista").value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=0;
    ls.forEach(l=>{const [nm,mat,email,tel]=l.split(";").map(x=>x.trim());if(nm&&!S.alunos.some(a=>a.nome.toLowerCase()===nm.toLowerCase())){S.alunos.push({id:newId(),nome:nm,mat:mat||"",email:email||"",tel:tel||""});n++}});
    S.alunos.sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));if(n){save();renderView()}toast(n?n+" aluno(s) adicionado(s)":"Nenhum aluno novo (nomes vazios ou repetidos).")}
  else if(a==="alunodel"){const id=b.dataset.id;if(UI.confirm==="al"+id){S.alunos=S.alunos.filter(x=>x.id!==id);Object.values(S.reg).forEach(r=>{if(r.faltas)delete r.faltas[id]});UI.confirm=null;save()}else UI.confirm="al"+id;renderView()}
  else if(a==="frcsv"){const C=calc(),fm=faltasMap(),L=[["Aluno","Matrícula",...C.rows.map(r=>r.u.sigla+" (lim. "+r.R+")"),"Total"].join(";")];
    S.alunos.forEach(a=>{let tot=0;const c=C.rows.map(r=>{const n=(fm[a.id]||{})[r.u.sigla]||0;tot+=n;return n});L.push([a.nome,a.mat||"",...c,tot].join(";"))});
    DL.save({filename:`frequencia-turma-${S.cfg.turma}.csv`,data:"\ufeff"+L.join("\n")}).then(()=>toast("Arquivo salvo"),er=>{if(!er||er.code!=="declined")toast("Não foi possível salvar o arquivo.")})}
  else if(a==="copyv")copyValue(b.dataset.v);
  else if(a==="dldoc"){const d=G.docentes.find(x=>slug(x.nome)===DOC_ID);if(d&&DL)DL.save({filename:`aulas-${DOC_ID}.csv`,data:"\ufeff"+csvDoc(docAgg(d))}).then(()=>toast("Arquivo salvo"),er=>{if(!er||er.code!=="declined")toast("Não foi possível salvar o arquivo.")})}
  else if(a==="copy")copyText(b.dataset.id);
  else if(a==="import"){try{const o=JSON.parse(document.getElementById("tImp").value);if(o.turmas&&o.geral){G=o.geral;T=o.turmas;CUR=Object.keys(T)[0]}else if(o.cfg&&o.ucs&&o.days){const m=legacyToMulti(o);G=m.G;T=m.T;CUR=m.CUR}else throw 0;normalize();save();toast("Dados restaurados");renderView()}catch(x){toast("JSON inválido. Cole a cópia completa.")}}
  else if(a==="reset"){if(UI.confirm==="reset"){{const m=seedAll();G=m.G;T=m.T;CUR=m.CUR}normalize();UI.confirm=null;UI.month=null;save();toast("Planilha original restaurada")}else UI.confirm="reset";renderView()}
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.id==="turmaSel"){CUR=t.value;normalize();UI.month=null;UI.ucFilter="";persistLocal();renderView()}
  else if(t.id==="mjump"){UI.month=t.value;renderView()}
  else if(t.id==="rfSel"){UI.rf=t.value;renderView()}
  else if(t.dataset.av!==undefined){const k=t.dataset.av;S.aviso[k]=t.type==="checkbox"?t.checked:t.value;if((k==="auto"||k==="lembrete")&&t.checked)PLAN.api({op:"notify_baseline",turma:CUR});save();UI.av=null;renderView()}
  else if(t.id==="rSab"){UI.repSab=t.checked;renderView()}
  else if(t.id==="rSit"){document.getElementById("rNao").hidden=t.value!=="nao";document.getElementById("rSim").hidden=t.value!=="sim"}
  else if(t.dataset.al!==undefined){const a=S.alunos.find(x=>x.id===t.dataset.al);if(a){const v=t.value.trim();if(t.dataset.f==="nome"&&!v){toast("O nome não pode ficar vazio.");renderView();return}a[t.dataset.f]=v;save()}}
  else if(t.id==="cf"){UI.ucFilter=t.value;renderView()}
  else if(t.id==="aUc"){const r=calc().rows.find(r=>r.u.sigla===t.value);document.getElementById("aQty").value=Math.max(r?r.faltam:1,1)}
  else if(t.id==="mS1"||t.id==="mS2"||t.id==="mT")updModalInfo();
  else if(t.id==="fImp"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{document.getElementById("tImp").value=fr.result};fr.readAsText(t.files[0])}
  else if(t.dataset.cfg){const k=t.dataset.cfg;S.cfg[k]=k==="aulasDia"?Math.max(1,+t.value||1):t.value;if(k==="inicio")UI.month=null;
    if(k==="turma"){const nid=String(t.value).trim().replace(/[^\w.-]/g,"").slice(0,60);if(nid&&nid!==CUR&&!T[nid]){T[nid]=T[CUR];delete T[CUR];CUR=nid;normalize();toast("Código da turma atualizado. Os links antigos dessa turma deixam de valer.")}}
    save();renderView()}
  else if(t.dataset.bw!==undefined){
    const d=S.docentes[+t.dataset.bw],w=+t.dataset.wd;d.semana=d.semana.filter(x=>x!==w);if(t.checked)d.semana.push(w);d.semana.sort();
    save();renderView();const n=countConf();if(n)toast(`${n} aula(s) já lançadas entram em choque. Veja os avisos no Painel.`)}
  else if(t.dataset.bd!==undefined){
    const b=S.docentes[+t.dataset.bd].bloqueios[+t.dataset.j];b[t.dataset.f]=t.value;if(b.de&&b.ate&&b.ate<b.de)b.ate=b.de;
    save();renderView();const n=countConf();if(n)toast(`${n} aula(s) já lançadas entram em choque. Veja os avisos no Painel.`)}
  else if(t.dataset.gbase){G.base=t.value.trim().split("#")[0]||BASE0;save();renderView()}
  else if(t.dataset.cfgx){S.cfg[t.dataset.cfgx]=t.value.trim();UI.env.msg=null;save();if(t.id==="envDest")renderView()}
  else if(t.dataset.doc!==undefined){
    const d=S.docentes[+t.dataset.doc],f=t.dataset.f,v=t.value.trim();
    if(f==="nome"){if(!v||S.docentes.some(x=>x!==d&&x.nome===v)){toast("Nome vazio ou já cadastrado.");renderView();return}
      Object.values(T).forEach(st=>st.ucs.forEach(u=>{if(u.docente===d.nome)u.docente=v}))}
    d[f]=v;save();renderView();
  }
  else if(t.dataset.uc!==undefined){
    const u=S.ucs[+t.dataset.uc],f=t.dataset.f;let v=t.value.trim();
    if(f==="ch")v=Math.max(0,+v||0);
    if(f==="sigla"){v=v.toUpperCase();if(!v||S.ucs.some(x=>x!==u&&x.sigla===v)){toast("Sigla vazia ou já usada.");renderView();return}
      const old=u.sigla;Object.values(S.days).forEach(d=>d.s=(d.s||[]).map(x=>x===old?v:x))}
    u[f]=v;save();renderView();
    if(f==="docente"||f==="sigla"){const n=countConf();if(n)toast(`${n} choque(s) com bloqueios de docentes. Veja os avisos no Painel.`)}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="holName")UI.holName=e.target.value;if(e.target.id==="envMsg")UI.env.msg=e.target.value});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal()});
window.addEventListener("hashchange",()=>location.reload());
renderView();
(async()=>{
  let db=null,u=null;
  try{db=window.claude&&await window.claude.use("db")}catch(e){}
  try{u=window.claude&&await window.claude.use("user")}catch(e){}
  try{UI.cw=u?u.can("data.write"):null}catch(e){}
  try{const me=window.PLAN&&await PLAN.me();UI.role=me&&me.role}catch(e){}
  if(db&&UI.cw===false&&MODE==="planner"){MODE="landing";T={x:emptyTurma()};CUR="x";normalize()}
  try{DL=window.claude&&await window.claude.use("downloads")}catch(e){}
  UI.boot=false;
  if(!db){UI.err="Não foi possível carregar o calendário agora.";setStatus("local");renderView();return}
  if(MODE==="landing"){renderView();return}
  if(MODE==="planner")renderView();
  dref=db.collection("planejador");
  let first=true;
  dref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const docs={};snap.docs.forEach(d=>{docs[d.id]=d.data()});
    const r=fromDocs(docs);
    if(MODE==="aluno"||MODE==="docente"){
      if(!Object.keys(r.t).length){UI.loaded=true;UI.empty=true;renderView();return}
      const prev=UI.loaded?canon([G,T,CUR]):null;
      G=r.g;T=r.t;const ids=Object.keys(T);
      CUR=MODE==="docente"?"":(ALUNO_ID&&T[ALUNO_ID]?ALUNO_ID:(ids.length===1?ids[0]:""));
      normalize();UI.savedAt=CUR&&docs["turma-"+CUR]?docs["turma-"+CUR].savedAt||"":(Object.values(docs).map(x=>x.savedAt||"").sort().pop()||"");UI.empty=false;
      const changed=prev!==null&&prev!==canon([G,T,CUR]);UI.loaded=true;renderView();
      if(changed)toast("Calendário atualizado");return;
    }
    if(!Object.keys(r.t).length){if(first){first=false;lastJson={};save()}return}
    first=false;
    if(dirty||document.querySelector(".modal"))return;
    const cand={G:r.g,T:r.t},cur=canon([docItems()]);
    const keep=CUR;G=r.g;T=r.t;CUR=T[keep]?keep:Object.keys(T)[0];normalize();
    const now=docItems();
    lastJson={};now.forEach(([k,d])=>{lastJson[k]=canon(d)});
    if(r.legacy)delete lastJson.geral;
    if(canon([now])===cur&&!r.legacy){setStatus("saved");return}
    persistLocal();renderView();
    if(r.legacy)save();else setStatus("saved");
  },()=>{if(MODE!=="planner"){UI.err="Não foi possível carregar o calendário agora.";renderView()}else setStatus("error")});
})();
</script>
